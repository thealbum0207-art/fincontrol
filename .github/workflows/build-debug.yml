name: Testar FinControl 3 e compilar APK mais AAB

on:
  workflow_dispatch:
  push:
    branches: [main, feat/fincontrol-3-offline]

concurrency:
  group: fincontrol-android-build
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter estavel
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar projeto Android
        run: flutter create --platforms=android --org com.app --project-name fincontrol .
      - name: Configurar biometria Android
        run: python3 tool/configure_v3_android.py
      - name: Dependencias
        run: flutter pub get
      - name: Remover teste exemplo criado automaticamente pelo Flutter
        run: rm -f test/widget_test.dart
      - name: Analise estatica
        run: flutter analyze
      - name: Testes unitarios
        run: flutter test
      - name: Compilar APK de teste
        run: flutter build apk --debug
      - name: Disponibilizar APK real
        uses: actions/upload-artifact@v4
        with:
          name: FinControl-3-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Compilar Android App Bundle (AAB) para verificar o release
        run: flutter build appbundle --release
      - name: Conferir arquivo AAB gerado
        run: |
          ls -lh build/app/outputs/bundle/release/app-release.aab
          shasum -a 256 build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
      - name: Disponibilizar AAB com assinatura provisoria (NAO PUBLICAR)
        uses: actions/upload-artifact@v4
        with:
          name: FinControl-3-release-aab-assinatura-provisoria
          path: build/app/outputs/bundle/release/app-release.aab
