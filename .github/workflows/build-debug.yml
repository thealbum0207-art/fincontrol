name: Verificar e compilar APK de teste

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: fincontrol-android-build
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter estavel
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar projeto Android
        run: flutter create --platforms=android --org com.app --project-name fincontrol .
      - name: Dependencias
        run: flutter pub get
      - name: Analise estatica
        run: flutter analyze
      - name: Testes unitarios
        run: flutter test
      - name: Compilar APK de teste
        run: flutter build apk --debug
      - name: Disponibilizar APK real
        uses: actions/upload-artifact@v4
        with:
          name: FinControl-2-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
