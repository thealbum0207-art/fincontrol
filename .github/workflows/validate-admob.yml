name: Validar FinControl 3 sem anuncios

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'tool/configure_v3_android.py'
      - '.github/workflows/validate-admob.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar plataforma Android e configurar biometria
        run: |
          flutter create --platforms=android --org com.app --project-name fincontrol .
          python3 tool/configure_v3_android.py
          # flutter create cria teste padrao para MyApp, que nao existe no FinControl.
          # Manter apenas os testes reais versionados no repositorio.
          rm -f test/widget_test.dart
      - name: Verificar ausencia de anuncios
        run: |
          ! grep -R 'google_mobile_ads\|com.google.android.gms.ads.APPLICATION_ID' pubspec.yaml android/app/src/main/AndroidManifest.xml lib || exit 1
      - name: Instalar dependencias
        run: flutter pub get
      - name: Analise estatica
        run: flutter analyze
      - name: Testes Flutter
        run: flutter test
      - name: Testar compilacao APK sem anuncios
        run: flutter build apk --debug
