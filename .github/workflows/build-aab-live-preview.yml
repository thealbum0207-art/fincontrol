name: FinControl 2.0.7 AAB assinado — QA sem publicar

on:
  push:
    branches:
      - improve/fincontrol-2.0.7-data-brand
    paths:
      - '.github/workflows/build-aab-live-preview.yml'

permissions:
  contents: read

concurrency:
  group: fincontrol-207-qa-preview
  cancel-in-progress: false

jobs:
  release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Conferir assinatura autorizada
        env:
          FINCONTROL_UPLOAD_KEYSTORE_B64: ${{ secrets.FINCONTROL_UPLOAD_KEYSTORE_B64 }}
          FINCONTROL_STORE_PASSWORD: ${{ secrets.FINCONTROL_STORE_PASSWORD }}
          FINCONTROL_KEY_ALIAS: ${{ secrets.FINCONTROL_KEY_ALIAS }}
          FINCONTROL_KEY_PASSWORD: ${{ secrets.FINCONTROL_KEY_PASSWORD }}
          FINCONTROL_EXPECTED_UPLOAD_SHA1: ${{ secrets.FINCONTROL_EXPECTED_UPLOAD_SHA1 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FINCONTROL_UPLOAD_KEYSTORE_B64" || -z "$FINCONTROL_STORE_PASSWORD" || -z "$FINCONTROL_KEY_ALIAS" || -z "$FINCONTROL_KEY_PASSWORD" || -z "$FINCONTROL_EXPECTED_UPLOAD_SHA1" ]]; then
            echo "Segredos de assinatura ausentes."
            exit 1
          fi
          umask 077
          printf '%s' "$FINCONTROL_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fincontrol-upload.jks"
          echo "FINCONTROL_KEYSTORE_FILE=$RUNNER_TEMP/fincontrol-upload.jks" >> "$GITHUB_ENV"
          actual_sha="$(keytool -list -v -keystore "$RUNNER_TEMP/fincontrol-upload.jks" -alias "$FINCONTROL_KEY_ALIAS" -storepass "$FINCONTROL_STORE_PASSWORD" | sed -nE 's/^[[:space:]]*SHA1: ([A-Fa-f0-9:]+).*$/\1/p' | head -1)"
          if [[ -z "$actual_sha" ]]; then
            echo "Nao foi possivel verificar SHA1."
            exit 1
          fi
          normalized_actual="$(echo "$actual_sha" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          normalized_expected="$(echo "$FINCONTROL_EXPECTED_UPLOAD_SHA1" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          if [[ "$normalized_actual" != "$normalized_expected" ]]; then
            echo "SHA1 de upload nao corresponde ao esperado."
            exit 1
          fi

      - name: Conferir identidade e preparar Android
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'version: 2.0.7+10008' pubspec.yaml
          grep -Fq 'ca-app-pub-3964603090939340~3759405239' tool/configure_admob.py
          grep -Fq 'ca-app-pub-3964603090939340/4111381146' lib/ads/fin_ad_banner.dart
          grep -Fq "bool.fromEnvironment('ADMOB_LIVE_ADS', defaultValue: false)" lib/ads/fin_ad_banner.dart
          flutter create --platforms=android --org com.app --project-name fincontrol .
          python3 tool/configure_admob.py
          python3 tool/configure_branding.py
          grep -Fq 'android:label="FinControl"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Instalar dependencias e preservar correcoes de inicializacao
        env:
          FINCONTROL_STORE_PASSWORD: ${{ secrets.FINCONTROL_STORE_PASSWORD }}
          FINCONTROL_KEY_ALIAS: ${{ secrets.FINCONTROL_KEY_ALIAS }}
          FINCONTROL_KEY_PASSWORD: ${{ secrets.FINCONTROL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          rm -f test/widget_test.dart
          python3 tool/configure_release_signing.py
          python3 tool/configure_room_r8.py

      - name: Analisar e testar Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze
          flutter test

      - name: Compilar AAB comercial com ID real — SEM PUBLICAR
        env:
          FINCONTROL_STORE_PASSWORD: ${{ secrets.FINCONTROL_STORE_PASSWORD }}
          FINCONTROL_KEY_ALIAS: ${{ secrets.FINCONTROL_KEY_ALIAS }}
          FINCONTROL_KEY_PASSWORD: ${{ secrets.FINCONTROL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release --dart-define=ADMOB_LIVE_ADS=true

      - name: Validar integridade assinatura e permissoes
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/check_workdb_ctor.py build/app/outputs/bundle/release/app-release.aab
          python3 tool/check_ad_id_aab.py build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Disponibilizar AAB comercial para revisao humana
        uses: actions/upload-artifact@v4
        with:
          name: FinControl-2.0.7-10008-AAB-RELEASE-NAO-PUBLICADO
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
